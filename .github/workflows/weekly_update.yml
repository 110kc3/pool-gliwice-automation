name: Daily Schedule Update

on:
  schedule:
    - cron: '0 2 * * *' # Runs every night at 02:00 UTC (03:00 / 04:00 CET/CEST)
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Java (required by tabula-py)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node (required for frontend tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python environment
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          ./venv/bin/python -m pytest tests/test_master_aggregator.py
          node tests/test_availability.mjs

      - name: Download latest schedules from sport.gliwice.eu
        run: ./venv/bin/python download_schedules.py

      - name: Run parsers
        run: |
          ./venv/bin/python parse_mewa.py
          ./venv/bin/python parse_delfin.py
          ./venv/bin/python parse_olimpijczyk.py
          ./venv/bin/python parse_neptun.py

      - name: Run aggregator
        run: ./venv/bin/python master_aggregator.py

      - name: Validate generated schedules
        run: |
          ./venv/bin/python -m pytest tests/test_master_aggregator.py
          node tests/test_availability.mjs
          node -e '
            const { validatePoolData } = require("./script.js");
            const data = require("./data.json");
            const { pools, warnings } = validatePoolData(data);
            if (!pools || pools.length < 4) throw new Error("Validation failed: expected at least 4 pools");
            console.log("Healthcheck OK: " + pools.length + " pools validated successfully.");
          '

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json *_data.json *.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore(schedule): automated daily schedule update [skip ci]"
            git push origin master
          else
            echo "No schedule changes to commit."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Update pool schedules'
