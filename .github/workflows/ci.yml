name: Tests

on:
  push:
    branches: [master]
    paths-ignore: ['data.json', '*_data.json', '*.pdf']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: node tests/test_availability.mjs
      - run: node --test --test-reporter=dot tests/test_schedule_regressions.mjs tests/test_service_worker.mjs
