<head>

          "isBasedOn": "https://110kc3.github.io/pool-gliwice-automation/data.json"
        },
        {
          "@type": "ItemList",
          "name": "Gliwice municipal swimming pools",
          "numberOfItems": 3,
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "item": { "@type": "SportsActivityLocation", "name": "Pływalnia Delfin", "address": { "@type": "PostalAddress", "addressLocality": "Gliwice", "addressCountry": "PL" } } },

            { "@type": "ListItem", "position": 3, "item": { "@type": "SportsActivityLocation", "name": "Pływalnia Olimpijczyk", "address": { "@type": "PostalAddress", "addressLocality": "Gliwice", "addressCountry": "PL" } } }
